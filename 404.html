<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>

    <!--
      GitHub Pages SPA fallback for Blazor WebAssembly.

      Any unknown route (like /authentication/login or
      /authentication/login-callback?code=...&state=...)
      will be served this file.

      We forward to /index.html, keeping:
        - the original query string (?code=..., etc.)
        - the original path in the hash (#/authentication/...)
        - any existing hash (rare, but we keep it).
    -->
</head>
<body>
    <script>
        (function () {
            // Original URL parts
            var path  = window.location.pathname || "/";
            var query = window.location.search || "";
            var hash  = window.location.hash   || "";

            // App root on GitHub Pages (user site → root)
            var appBase = "/";

            // Path relative to app base, e.g. "authentication/login-callback"
            var relative = "";
            if (path.startsWith(appBase)) {
                relative = path.substring(appBase.length);
            }

            // Build new URL: /index.html?query#/relative + original hash (if any)
            var newUrl = appBase + "index.html";

            // Keep ?code=...&state=... etc.
            if (query) {
                newUrl += query;
            }

            // Put original path into hash so Blazor router sees it
            if (relative && relative.length > 0) {
                newUrl += "#" + relative;
            }

            // If there was already a hash (rare), append it too
            if (hash) {
                newUrl += hash;
            }

            window.location.replace(newUrl);
        })();
    </script>
</body>
</html>
