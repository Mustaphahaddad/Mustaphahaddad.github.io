<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <base href="/" />
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("theme");
                var theme = stored === "dark" || stored === "light"
                    ? stored
                    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.style.colorScheme = theme;
            } catch { }
        })();
    </script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/open-iconic/1.1.1/font/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/app.css" />

</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <script src="js/rowTooltip.js"></script>
    <script src="js/meetingInterop.js"></script>
    <script src="js/appDateInput.js"></script>
    <script src="js/svgHelpers.js"></script>
    <script src="js/theme.js"></script>

    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>

    <script src="js/three/three.min.js"></script>
    <script src="js/stlViewer.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>


    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/planGrid.js"></script>

</body>

</html>
